name: Verify live Slice 18 Foundry

on:
  push:
    branches:
      - deploy/slice18-accordion-57dc766e

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live deployment record and Accordion markers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, time, urllib.request

          record_url = 'https://neosmartui.github.io/deployment.json'
          page_url = 'https://neosmartui.github.io/'
          source_sha = '57dc766ece8eca13b8c60b6f14615692ecdb51e8'
          markers = [
              'NeoSmartUI Foundry',
              'core.accordion',
              'Accordion discloses related content with real buttons',
              'data-expansion="single"',
              'data-expansion="multiple"',
              'aria-controls="accordion-single-panel-a"',
          ]

          def fetch(url, attempts=8):
              last = None
              for attempt in range(1, attempts + 1):
                  try:
                      req = urllib.request.Request(url, headers={
                          'Cache-Control': 'no-cache',
                          'User-Agent': 'NeoSmartUI-Slice18-Live-Verify/1',
                      })
                      with urllib.request.urlopen(req, timeout=15) as response:
                          if response.status == 200:
                              return response.read().decode('utf-8')
                          last = RuntimeError(f'HTTP {response.status}')
                  except Exception as exc:
                      last = exc
                  if attempt < attempts:
                      time.sleep(5)
              raise SystemExit(f'{url} failed after {attempts} attempts: {last}')

          record = json.loads(fetch(record_url))
          if record.get('schema') != 'neosmartui/deployment-record@1':
              raise SystemExit(f'wrong deployment schema: {record}')
          if record.get('sourceRepository') != 'neosmartui/neosmartui':
              raise SystemExit(f'wrong source repository: {record}')
          if record.get('sourceSha') != source_sha:
              raise SystemExit(f'wrong source SHA: {record.get("sourceSha")}')
          if record.get('artifact') != 'foundry':
              raise SystemExit(f'wrong artifact: {record}')

          html = fetch(page_url)
          missing = [marker for marker in markers if marker not in html]
          if missing:
              raise SystemExit(f'live page missing markers: {missing}')

          print(f'live deployment record = {source_sha}')
          print(f'live page contains {len(markers)}/{len(markers)} Slice 18 markers')
          PY
